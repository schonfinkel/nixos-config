name: "[QEMU] Image Build"

on:
  push:
    branches: [ "master" ]
    paths:
      - .github/workflows/**
      - home/**
      - hosts/**
      - modules/**
      - profiles/**
      - overlays/**
      - virtualization/**
      - "*.nix"
      - flake.lock
  pull_request:
    branches: [ "master" ]
    paths:
      - .github/workflows/**
      - home/**
      - hosts/**
      - modules/**
      - profiles/**
      - overlays/**
      - virtualization/**
      - "*.nix"
      - flake.lock

permissions:
  contents: read

jobs:
  build:
    name: "[QEMU] Build Image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'rampage'

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Mostly to avoid GitHub rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Install Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # To leverage devenv inside Github Actions
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # Ubuntu 24.04 runners restrict unprivileged user namespaces via
      # AppArmor, which breaks the `unshare --map-root-user` step inside
      # systemd-repart's image build. Relax it for the duration of the job.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Actual Pipelines
      - name: "[QEMU] Build"
        run: nix build .#qemu
